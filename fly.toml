app = "openchat-autoreply"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  path = "/api/accounts"
  interval = "30s"

[[vm]]
  memory = "1gb"
  cpus = 1

[mounts]
  source = "data"
  destination = "/data"